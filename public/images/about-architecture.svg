<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#abg)" rx="12"/>
  <!-- 架构框图 -->
  <g font-family="Inter,sans-serif" font-size="10" font-weight="600">
    <!-- core 层 -->
    <rect x="30" y="50" width="120" height="36" rx="6" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="73" text-anchor="middle" fill="#60a5fa">core/</text>
    <text x="90" y="105" text-anchor="middle" fill="#64748b" font-size="9" font-weight="400">Source · Detector · Object</text>
    <!-- engine 层 -->
    <rect x="190" y="50" width="120" height="36" rx="6" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="250" y="73" text-anchor="middle" fill="#22d3ee">engine/</text>
    <text x="250" y="105" text-anchor="middle" fill="#64748b" font-size="9" font-weight="400">RayField · RayCaster · Kernels</text>
    <!-- scan 层 -->
    <rect x="350" y="50" width="120" height="36" rx="6" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="410" y="73" text-anchor="middle" fill="#a78bfa">scan/</text>
    <text x="410" y="105" text-anchor="middle" fill="#64748b" font-size="9" font-weight="400">Trajectories · Runner</text>
    <!-- pipeline -->
    <rect x="100" y="160" width="300" height="40" rx="8" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="250" y="185" text-anchor="middle" fill="#94a3b8" font-size="12">Pipeline — Projection Flow</text>
    <!-- postprocess -->
    <rect x="60" y="240" width="160" height="36" rx="6" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1"/>
    <text x="140" y="263" text-anchor="middle" fill="#34d399">postprocess/</text>
    <text x="140" y="295" text-anchor="middle" fill="#64748b" font-size="9" font-weight="400">Blur · Noise · Annotation</text>
    <!-- exporter -->
    <rect x="280" y="240" width="160" height="36" rx="6" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1"/>
    <text x="360" y="263" text-anchor="middle" fill="#fbbf24">exporter/</text>
    <text x="360" y="295" text-anchor="middle" fill="#64748b" font-size="9" font-weight="400">Images · Annotations · Meta</text>
    <!-- 连接箭头 -->
    <line x1="90" y1="86" x2="90" y2="160" stroke="#3b82f6" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
    <line x1="250" y1="86" x2="250" y2="160" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
    <line x1="410" y1="86" x2="350" y2="160" stroke="#8b5cf6" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
    <line x1="200" y1="200" x2="140" y2="240" stroke="#10b981" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
    <line x1="300" y1="200" x2="360" y2="240" stroke="#f59e0b" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
  </g>
  <text x="250" y="370" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="11">[PLACEHOLDER] Replace with actual architecture diagram</text>
</svg>
