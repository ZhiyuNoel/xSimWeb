<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0f1724" rx="6"/>
  <text x="200" y="25" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" font-weight="600">MATERIAL ATTENUATION</text>
  <!-- 衰减可视化 -->
  <defs>
    <linearGradient id="att" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- 材料 A: 低衰减 -->
  <rect x="40" y="50" width="320" height="50" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.04)"/>
  <text x="60" y="42" fill="#3b82f6" font-family="Inter,sans-serif" font-size="9" font-weight="600">Aluminum (μ = 0.15)</text>
  <rect x="50" y="60" width="300" height="30" rx="3" fill="url(#att)" opacity="0.3"/>
  <!-- 材料 B: 中衰减 -->
  <rect x="40" y="120" width="320" height="50" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.04)"/>
  <text x="60" y="112" fill="#06b6d4" font-family="Inter,sans-serif" font-size="9" font-weight="600">Steel (μ = 0.45)</text>
  <rect x="50" y="130" width="300" height="30" rx="3" fill="url(#att)" opacity="0.6"/>
  <!-- 材料 C: 高衰减 -->
  <rect x="40" y="190" width="320" height="50" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.04)"/>
  <text x="60" y="182" fill="#f59e0b" font-family="Inter,sans-serif" font-size="9" font-weight="600">Lead (μ = 1.20)</text>
  <rect x="50" y="200" width="300" height="30" rx="3" fill="url(#att)" opacity="0.9"/>
  <!-- Beer-Lambert 公式 -->
  <rect x="80" y="250" width="240" height="25" rx="4" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.15)"/>
  <text x="200" y="267" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">I = I₀ · exp(−μ · L)</text>
  <text x="200" y="290" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="10">[PLACEHOLDER] Material attenuation</text>
</svg>
