<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0f1724" rx="6"/>
  <text x="200" y="25" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" font-weight="600">SSAA COMPARISON</text>
  <!-- 1x 无抗锯齿 -->
  <rect x="20" y="40" width="170" height="120" rx="3" fill="#0a0e17" stroke="rgba(255,255,255,0.06)"/>
  <text x="105" y="58" text-anchor="middle" fill="#ef4444" font-family="Inter,sans-serif" font-size="9" font-weight="600">1× (No SSAA)</text>
  <!-- 锯齿边缘模拟 -->
  <g fill="rgba(148,163,184,0.15)">
    <rect x="50" y="75" width="10" height="10"/><rect x="60" y="75" width="10" height="10"/>
    <rect x="60" y="85" width="10" height="10"/><rect x="70" y="85" width="10" height="10"/>
    <rect x="70" y="95" width="10" height="10"/><rect x="80" y="95" width="10" height="10"/>
    <rect x="80" y="105" width="10" height="10"/><rect x="90" y="105" width="10" height="10"/>
    <rect x="90" y="115" width="10" height="10"/><rect x="100" y="115" width="10" height="10"/>
    <rect x="100" y="125" width="10" height="10"/><rect x="110" y="125" width="10" height="10"/>
    <rect x="110" y="135" width="10" height="10"/><rect x="120" y="135" width="10" height="10"/>
  </g>
  <!-- 2x SSAA -->
  <rect x="210" y="40" width="170" height="120" rx="3" fill="#0a0e17" stroke="rgba(59,130,246,0.15)"/>
  <text x="295" y="58" text-anchor="middle" fill="#3b82f6" font-family="Inter,sans-serif" font-size="9" font-weight="600">2× SSAA</text>
  <!-- 平滑边缘 -->
  <line x1="240" y1="75" x2="340" y2="140" stroke="rgba(148,163,184,0.3)" stroke-width="8" stroke-linecap="round"/>
  <!-- 放大对比框 -->
  <rect x="60" y="180" width="120" height="80" rx="4" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="120" y="250" text-anchor="middle" fill="#ef4444" font-family="Inter,sans-serif" font-size="8">Aliased edge detail</text>
  <rect x="220" y="180" width="120" height="80" rx="4" fill="rgba(59,130,246,0.05)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="280" y="250" text-anchor="middle" fill="#3b82f6" font-family="Inter,sans-serif" font-size="8">Smoothed edge detail</text>
  <text x="200" y="285" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="10">[PLACEHOLDER] SSAA anti-aliasing comparison</text>
</svg>
