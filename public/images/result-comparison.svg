<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <rect width="640" height="400" fill="#111827" rx="8"/>
  <text x="320" y="30" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" font-weight="600">QUALITATIVE VISUAL COMPARISON</text>
  <!-- 左: 参考图 -->
  <rect x="30" y="50" width="270" height="260" rx="4" fill="#0a0e17" stroke="rgba(255,255,255,0.06)"/>
  <text x="165" y="72" text-anchor="middle" fill="#f59e0b" font-family="Inter,sans-serif" font-size="10" font-weight="600">Reference Image</text>
  <rect x="55" y="85" width="220" height="200" rx="3" fill="rgba(148,163,184,0.06)"/>
  <rect x="80" y="110" width="170" height="150" rx="2" fill="rgba(148,163,184,0.1)"/>
  <rect x="100" y="130" width="50" height="70" rx="1" fill="rgba(148,163,184,0.14)"/>
  <rect x="170" y="140" width="60" height="90" rx="1" fill="rgba(148,163,184,0.12)"/>
  <!-- VS 分隔 -->
  <text x="320" y="190" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="14" font-weight="700">vs</text>
  <!-- 右: 仿真图 -->
  <rect x="340" y="50" width="270" height="260" rx="4" fill="#0a0e17" stroke="rgba(59,130,246,0.15)"/>
  <text x="475" y="72" text-anchor="middle" fill="#3b82f6" font-family="Inter,sans-serif" font-size="10" font-weight="600">Simulated Output</text>
  <rect x="365" y="85" width="220" height="200" rx="3" fill="rgba(59,130,246,0.04)"/>
  <rect x="390" y="110" width="170" height="150" rx="2" fill="rgba(59,130,246,0.08)"/>
  <rect x="410" y="130" width="50" height="70" rx="1" fill="rgba(59,130,246,0.12)"/>
  <rect x="480" y="140" width="60" height="90" rx="1" fill="rgba(59,130,246,0.1)"/>
  <!-- 底部度量 -->
  <rect x="100" y="330" width="440" height="35" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.04)"/>
  <text x="320" y="352" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="10">Qualitative structural similarity assessment for validation</text>
