<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0f1724" rx="6"/>
  <!-- 探测器几何配置示意 -->
  <rect x="80" y="50" width="240" height="200" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>
  <!-- 探测器面板 -->
  <rect x="140" y="80" width="120" height="140" rx="2" fill="rgba(6,182,212,0.08)" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- 像素网格 -->
  <g stroke="rgba(6,182,212,0.15)" stroke-width="0.5">
    <line x1="140" y1="115" x2="260" y2="115"/><line x1="140" y1="150" x2="260" y2="150"/>
    <line x1="140" y1="185" x2="260" y2="185"/>
    <line x1="170" y1="80" x2="170" y2="220"/><line x1="200" y1="80" x2="200" y2="220"/>
    <line x1="230" y1="80" x2="230" y2="220"/>
  </g>
  <!-- 尺寸标注 -->
  <line x1="130" y1="80" x2="130" y2="220" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="120" y="155" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="8" transform="rotate(-90 120 155)">height</text>
  <line x1="140" y1="230" x2="260" y2="230" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="200" y="245" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="8">width</text>
  <!-- 坐标系 -->
  <line x1="310" y1="190" x2="350" y2="190" stroke="#ef4444" stroke-width="1.5"/><text x="358" y="193" fill="#ef4444" font-family="Inter,sans-serif" font-size="8">u</text>
  <line x1="310" y1="190" x2="310" y2="150" stroke="#10b981" stroke-width="1.5"/><text x="315" y="145" fill="#10b981" font-family="Inter,sans-serif" font-size="8">v</text>
  <line x1="310" y1="190" x2="330" y2="210" stroke="#3b82f6" stroke-width="1.5"/><text x="335" y="218" fill="#3b82f6" font-family="Inter,sans-serif" font-size="8">n</text>
  <text x="200" y="280" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="10">[PLACEHOLDER] Detector geometry config</text>
</svg>
