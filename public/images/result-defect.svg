<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <rect width="640" height="400" fill="#111827" rx="8"/>
  <text x="320" y="30" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" font-weight="600">DEFECT VISIBILITY ANALYSIS</text>
  <!-- 两张对比图 -->
  <rect x="30" y="50" width="270" height="250" rx="4" fill="#0a0e17" stroke="rgba(255,255,255,0.06)"/>
  <text x="165" y="72" text-anchor="middle" fill="#10b981" font-family="Inter,sans-serif" font-size="10" font-weight="600">Without Defect</text>
  <rect x="70" y="90" width="190" height="190" rx="3" fill="rgba(148,163,184,0.08)"/>
  <rect x="100" y="120" width="130" height="130" rx="2" fill="rgba(148,163,184,0.12)"/>

  <rect x="340" y="50" width="270" height="250" rx="4" fill="#0a0e17" stroke="rgba(255,255,255,0.06)"/>
  <text x="475" y="72" text-anchor="middle" fill="#ef4444" font-family="Inter,sans-serif" font-size="10" font-weight="600">With Embedded Defect</text>
  <rect x="380" y="90" width="190" height="190" rx="3" fill="rgba(148,163,184,0.08)"/>
  <rect x="410" y="120" width="130" height="130" rx="2" fill="rgba(148,163,184,0.12)"/>
  <!-- 缺陷标记 -->
  <circle cx="465" cy="190" r="12" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="465" y1="175" x2="465" y2="205" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="190" x2="480" y2="190" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <rect x="440" y="210" width="50" height="15" rx="3" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="0.5"/>
  <text x="465" y="221" text-anchor="middle" fill="#ef4444" font-family="Inter,sans-serif" font-size="8" font-weight="600">DEFECT</text>
  <!-- 差异指示箭头 -->
  <text x="320" y="180" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="20">→</text>
  <!-- 底部说明 -->
  <rect x="30" y="315" width="580" height="50" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.04)"/>
  <text x="320" y="345" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="10">Detectability assessment under controlled imaging parameters</text>
  <text x="320" y="385" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="11">[PLACEHOLDER] Replace with actual defect analysis</text>
</svg>
