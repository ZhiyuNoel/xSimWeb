<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <rect width="640" height="400" fill="#111827" rx="8"/>
  <text x="320" y="30" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" font-weight="600">PARAMETER SENSITIVITY ANALYSIS</text>
  <!-- 参数变化趋势图 -->
  <rect x="50" y="50" width="540" height="280" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.04)"/>
  <!-- 坐标轴 -->
  <line x1="90" y1="290" x2="550" y2="290" stroke="#334155" stroke-width="1"/>
  <line x1="90" y1="80" x2="90" y2="290" stroke="#334155" stroke-width="1"/>
  <text x="320" y="320" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="10">Attenuation Coefficient μ (mm⁻¹)</text>
  <text x="50" y="190" fill="#64748b" font-family="Inter,sans-serif" font-size="10" transform="rotate(-90 50 190)">Intensity</text>
  <!-- 曲线 1 -->
  <polyline points="100,260 160,250 220,230 280,200 340,160 400,130 460,110 520,100" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <!-- 曲线 2 -->
  <polyline points="100,270 160,260 220,245 280,220 340,190 400,165 460,150 520,145" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.8" stroke-dasharray="6 3"/>
  <!-- 曲线 3 -->
  <polyline points="100,280 160,275 220,268 280,255 340,238 400,220 460,210 520,205" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.8" stroke-dasharray="3 3"/>
  <!-- 图例 -->
  <rect x="380" y="70" width="160" height="70" rx="4" fill="rgba(17,24,39,0.8)" stroke="rgba(255,255,255,0.06)"/>
  <line x1="395" y1="90" x2="420" y2="90" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="93" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9">SSAA 1× (baseline)</text>
  <line x1="395" y1="108" x2="420" y2="108" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="430" y="111" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9">SSAA 2×</text>
  <line x1="395" y1="126" x2="420" y2="126" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="430" y="129" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9">SSAA 4×</text>
  <text x="320" y="370" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="11">[PLACEHOLDER] Replace with actual sensitivity analysis</text>
</svg>
