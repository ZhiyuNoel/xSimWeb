<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="beam" x1="100" y1="100" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="150" cy="150" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 背景 -->
  <rect width="600" height="600" fill="url(#bg)" rx="16"/>
  <!-- 网格线 -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
  </g>
  <!-- X-ray 光源点 -->
  <circle cx="150" cy="150" r="12" fill="#60a5fa"/>
  <circle cx="150" cy="150" r="40" fill="url(#glow)"/>
  <text x="150" y="120" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" font-weight="600">SOURCE</text>
  <!-- 射线束 -->
  <polygon points="150,150 400,280 400,520 150,150" fill="url(#beam)" opacity="0.3"/>
  <line x1="150" y1="150" x2="400" y2="280" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <line x1="150" y1="150" x2="400" y2="520" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <line x1="150" y1="150" x2="400" y2="350" stroke="#60a5fa" stroke-width="1" opacity="0.4" stroke-dasharray="6 4"/>
  <line x1="150" y1="150" x2="400" y2="420" stroke="#60a5fa" stroke-width="1" opacity="0.4" stroke-dasharray="6 4"/>
  <!-- 被检物体 -->
  <rect x="260" y="320" width="60" height="100" rx="4" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="270" y="360" width="15" height="20" rx="2" fill="rgba(239,68,68,0.4)" stroke="#ef4444" stroke-width="1" opacity="0.7"/>
  <text x="290" y="310" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" font-weight="600">OBJECT</text>
  <!-- 探测器面板 -->
  <line x1="400" y1="270" x2="400" y2="530" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="440" y="400" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" font-weight="600">DETECTOR</text>
  <!-- 投影结果提示 -->
  <rect x="420" y="310" width="120" height="180" rx="6" fill="rgba(17,24,39,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="430" y="320" width="100" height="12" rx="2" fill="rgba(59,130,246,0.15)"/>
  <rect x="430" y="340" width="100" height="140" rx="2" fill="rgba(255,255,255,0.03)"/>
  <text x="480" y="416" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="10">Projection</text>
  <!-- 标题 -->
  <text x="300" y="575" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="12" font-weight="500">[PLACEHOLDER] Replace with actual simulation visualization</text>
</svg>
