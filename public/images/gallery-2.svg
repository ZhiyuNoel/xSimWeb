<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0f1724" rx="6"/>
  <!-- CT 多角度序列缩略图 -->
  <g opacity="0.7">
    <rect x="20" y="30" width="80" height="80" rx="3" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)"/>
    <rect x="110" y="30" width="80" height="80" rx="3" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)"/>
    <rect x="200" y="30" width="80" height="80" rx="3" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)"/>
    <rect x="290" y="30" width="80" height="80" rx="3" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)"/>
    <rect x="20" y="120" width="80" height="80" rx="3" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)"/>
    <rect x="110" y="120" width="80" height="80" rx="3" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)"/>
    <rect x="200" y="120" width="80" height="80" rx="3" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)"/>
    <rect x="290" y="120" width="80" height="80" rx="3" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)"/>
  </g>
  <text x="60" y="75" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">0°</text>
  <text x="150" y="75" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">45°</text>
  <text x="240" y="75" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">90°</text>
  <text x="330" y="75" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">135°</text>
  <text x="60" y="165" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">180°</text>
  <text x="150" y="165" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">225°</text>
  <text x="240" y="165" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">270°</text>
  <text x="330" y="165" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">315°</text>
  <!-- 圆弧轨迹示意 -->
  <path d="M 100 250 Q 200 220 300 250" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="245" r="4" fill="#06b6d4"/>
  <text x="200" y="280" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="10">[PLACEHOLDER] CT scan sequence</text>
</svg>
